# 下面是dify
  dify-api:
    image: langgenius/dify-api:1.4.1
    hostname: api
#    restart: always
    environment:
      # Startup mode, 'api' starts the API server.
      MODE: api
    depends_on:
      - mypostgres
      - myredis
    volumes:
      # Mount the storage directory to the container, for storing user files.
      - /mnt/data/vergil/dify/storage:/app/api/storage
    ports:
      - 25001:5001
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - dify/dify.env
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  dify-worker:
    image: langgenius/dify-api:1.4.1
    hostname: worker
#    restart: always
    environment:
      # Startup mode, 'worker' starts the Celery worker for processing the queue.
      MODE: worker
    depends_on:
      - mypostgres
      - myredis
    volumes:
      # Mount the storage directory to the container, for storing user files.
      - /mnt/data/vergil/dify/storage:/app/api/storage
    extra_hosts:
      - host.docker.internal:host-gateway
