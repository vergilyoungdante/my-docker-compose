  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    privileged: true
    container_name: myminio
    ports:
      - 29000:9000
      - 29090:9090
    command: minio server /data --console-address ":9090"
    environment:
      - MINIO_ROOT_USER=vergil
      - MINIO_ROOT_PASSWORD=xyfs2023
    volumes:
      - /mnt/data/vergil/minio:/data
#    deploy:
#      resources:
#        limits:
#          cpus: 4
#          memory: 8G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mynacos:
    image: nacos/nacos-server:v3.0.1
    container_name: mynacos
    ports:
      - 28080:8080
      - 28848:8848
      - 29848:9848
    volumes:
      - /mnt/data/vergil/nacos:/home/nacos/logs
    env_file:
      - nacos/nacos.env
    depends_on:
      mymysql:
        condition: service_healthy
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"

