  etcd:
    container_name: etcd
    image: quay.io/coreos/etcd:v3.5.21
    hostname: etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - /mnt/data/vergil/etcd:/etcd-data
    command: /usr/local/bin/etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir=/etcd-data
    ports:
      - 22379:2379
      - 22380:2380
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mymilvus:
    build:
      context: milvus/
      dockerfile: milvus.dockerfile
    #    image: milvusdb/milvus:v2.5.12
    container_name: milvus-standalone
    hostname: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    security_opt:
      - seccomp:unconfined
    volumes:
      - /mnt/data/vergil/milvus:/var/lib/milvus
    ports:
      - "39530:19530"
      - "39091:9091"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - "minio"
      - "etcd"

  attu:
    container_name: attu
    image: zilliz/attu:v2.5.12
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "33000:3000"
    depends_on:
      - "mymilvus"

