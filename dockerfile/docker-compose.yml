version: '3.8'

networks:
  #给监控用的，node_exporter什么的不暴露外网
  monitor:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
  elastic:
    driver: bridge


services:

  myredis:
    build:
      context: redis/
      dockerfile: redis.dockerfile
    container_name: vergil-redis
    hostname: vergil-redis
    volumes:
      - /mnt/data/vergil/redis:/data
    ports:
      - 26379:6379
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli","ping" ]
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mypostgres:
    image: postgres:17.5
    container_name: vergil-postgres
    hostname: vergil-postgres
    user: root
    privileged: true
    ports:
      - 25432:5432
    environment:
      POSTGRES_PASSWORD: xyfs2023
      POSTGRES_USER: postgres
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - /mnt/data/vergil/postgres:/var/lib/postgresql/data
    restart: always
#    deploy:
#      resources:
#        limits:
#          cpus: 4
#          memory: 8G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  myrabbitmq:
    image: rabbitmq:4.1.0-management
    container_name: vergil-rabbitmq
    ports:
      - 25672:5672
      - 35672:15672
    environment:
      - RABBITMQ_DEFAULT_PASS=xyfs2023
      - RABBITMQ_DEFAULT_USER=vergil
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  mymysql:
    build:
      context: mysql/
      dockerfile: mysql.dockerfile
    container_name: vergil-mysql
    environment:
      MYSQL_ROOT_PASSWORD: xyfs2023 #root管理员用户密码
      MYSQL_DATABASE: nacos_dev
      MYSQL_USER: nacosvergil
      MYSQL_PASSWORD: nacosxyfs2023
      LANG: C.UTF-8
    volumes:
      #mysql数据库挂载到host物理机目录
      - /mnt/data/vergil/mysql/db:/var/lib/mysql
      #容器的配置目录挂载到host物理机目录
      - /mnt/data/vergil/mysql/config:/etc/mysql/conf.d
    ports:
      - 23306:3306
    restart: always
#    deploy:
#      resources:
#        limits:
#          cpus: 4
#          memory: 8G
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 5s
      timeout: 10s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

